name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      transformer:
        description: Also download and benchmark the optional local transformer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: node --check stockbrief/static/workspace.js
      - run: python -m stockbrief evaluate --cpus 1 > /tmp/stockbrief-evaluation.json
      - if: github.event_name == 'workflow_dispatch' && inputs.transformer
        run: |
          python -m pip install -r requirements-transformer.txt
          python -m stockbrief fetch-model
          python -m stockbrief evaluate --cpus 1 --transformer models/mobilebert
