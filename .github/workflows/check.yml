name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      transformer:
        description: Also download and benchmark the optional local transformer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m stockbrief fetch-semantic
      - run: python -m unittest discover -v
      - run: node --check stockbrief/static/workspace.js
      - name: Evaluate the default classifier
        run: python -m stockbrief evaluate --cpus 1 > "$RUNNER_TEMP/evaluation.json"
      - name: Install and fetch the pinned transformer
        if: github.event_name == 'workflow_dispatch' && inputs.transformer
        run: |
          python -m pip install -r requirements-transformer.txt
          python -m stockbrief fetch-model
      - name: Test and evaluate the local transformer
        if: github.event_name == 'workflow_dispatch' && inputs.transformer
        env:
          HF_HUB_OFFLINE: "1"
          STOCKBRIEF_MODEL_DIR: models/mobilebert
        run: |
          python -m unittest tests.test_transformer -v
          python -m stockbrief evaluate --cpus 1 --transformer "$STOCKBRIEF_MODEL_DIR" > "$RUNNER_TEMP/transformer-evaluation.json"
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: stockbrief-evaluation
          path: ${{ runner.temp }}/*evaluation.json
          if-no-files-found: error
          retention-days: 14
