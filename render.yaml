services:
  - type: web
    name: stockbrief-edge
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m stockbrief serve --hosted
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
